<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    $FLUTTER_BASE_HREF 는 flutter build 시 --base-href 값으로 바뀐다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="베를린 소망교회 교인들의 책 나눔 도서관">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS: 홈 화면에 추가 (웹 푸시는 홈 화면에 추가한 경우에만 동작) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="소망 도서관">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#2F5D50">
  <title>소망 도서관</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FBF8F1; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2F5D50;
    }
    #boot img { width: 72px; height: 72px; border-radius: 18px; }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="">
    <div>소망 도서관 불러오는 중…</div>
  </div>
  <script>
    // Flutter 첫 프레임이 그려지면 로딩 화면 제거
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.remove();
    });
  </script>
  <script>
    // 사진에서 책 바코드 읽기 — zxing-wasm (web/zxing, MIT) 을 처음 쓸 때만 불러온다.
    // Dart 쪽: lib/services/photo_barcode.dart
    (function () {
      var ready = null;
      function load() {
        if (ready) return ready;
        ready = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = 'zxing/reader.js';
          s.onload = function () {
            ZXingWASM.prepareZXingModule({
              overrides: {
                locateFile: function (path, prefix) {
                  return path.endsWith('.wasm')
                    ? new URL('zxing/zxing_reader.wasm', document.baseURI).href
                    : prefix + path;
                }
              }
            });
            resolve();
          };
          s.onerror = function () { ready = null; reject(new Error('바코드 인식 모듈을 불러오지 못했어요')); };
          document.head.appendChild(s);
        });
        return ready;
      }
      window.somangReadBarcodes = async function (image) {
        await load();
        var results = await ZXingWASM.readBarcodes(image, {
          formats: ['EAN-13', 'EAN-8', 'UPC-A'],
          tryHarder: true,
          maxNumberOfSymbols: 4
        });
        return results.filter(function (r) { return r.isValid; })
                      .map(function (r) { return r.text; });
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
