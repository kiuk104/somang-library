<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    $FLUTTER_BASE_HREF 는 flutter build 시 --base-href 값으로 바뀐다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="베를린 소망교회 교인들의 책 나눔 도서관">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS: 홈 화면에 추가 (웹 푸시는 홈 화면에 추가한 경우에만 동작) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="소망 도서관">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#2F5D50">
  <title>소망 도서관</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FBF8F1;
      /* 내용이 화면보다 짧을 때 아래로 끌면 브라우저 새로고침(당겨서 새로고침)이 되는 것을 막는다 */
      overscroll-behavior: none; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2F5D50;
    }
    #boot img { width: 72px; height: 72px; border-radius: 18px; }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="">
    <div>소망 도서관 불러오는 중…</div>
  </div>
  <script>
    // Flutter 첫 프레임이 그려지면 로딩 화면 제거
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.remove();
    });
  </script>
  <!-- 책 바코드 인식 (실시간 스캔 + 사진) — lib/services/photo_barcode.dart 에서 호출 -->
  <script src="scanner.js"></script>
  <!-- flutter_bootstrap.js 대신 직접 부트스트랩: 도움말의 '실험' 에서 고른 렌더링 옵션을
       localStorage(somang_exp_engine) 에서 읽어 엔진에 넘긴다. (아이폰 강제 종료 원인 분리용) -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    (function () {
      var P = 'somang_exp_'; // localStorage 키 접두사 (Dart 쪽 WebPlatform 과 같은 키)
      var LS = null;
      try { LS = window.localStorage; } catch (e) {}
      function get(k) { try { return LS ? LS.getItem(P + k) : null; } catch (e) { return null; } }
      function set(k, v) { try { if (LS) LS.setItem(P + k, v); } catch (e) {} }
      function del(k) { try { if (LS) LS.removeItem(P + k); } catch (e) {} }

      var isIos = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var dpr = window.devicePixelRatio || 1;
      // A. iPhone 12/13 mini (375x812 @3x, 4GB) 는 CanvasKit 이 이미지를 WebGL 텍스처로 올릴 때
      //    GPU 메모리가 터져 강제 종료된다 (flutter/flutter#152709). 이 크기는 처음부터 CPU 렌더링.
      //    (같은 크기의 iPhone X/XS/11 Pro 도 메모리가 적어 함께 포함)
      var sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height);
      var isMiniSize = isIos && dpr >= 3 && sw === 375 && sh === 812;

      // 사용자가 고른 값('gpu'|'cpu'|'multi') 이 있으면 그대로, 없으면('' 자동) 아래 규칙
      var chosen = get('engine') || '';
      var mode = chosen;
      if (mode === '') mode = isMiniSize ? 'cpu' : 'gpu';

      // B. 자가 복구: 자동 모드로 WebGL 을 쓰는 iOS 기기에서 "지난 실행이 정상 종료되지 않음" 이
      //    30분 안에 2번 연속이면 이 기기는 강제 종료되는 기기로 보고 CPU 렌더링으로 전환해 저장한다.
      //    (화면이 보일 때만 표시를 남기고, 숨겨지면 지워서 백그라운드 종료는 세지 않는다)
      if (isIos && chosen === '' && mode === 'gpu') {
        var now = Date.now();
        var last = parseInt(get('gpu_alive') || '0', 10);
        var strikes = parseInt(get('gpu_strikes') || '0', 10);
        if (last && now - last < 30 * 60 * 1000) {
          strikes += 1;
        } else {
          strikes = 0;
        }
        set('gpu_strikes', String(strikes));
        if (strikes >= 2) {
          set('engine', 'cpu');
          set('engine_auto', '1'); // 설정 카드에 "강제 종료 감지로 자동 전환됨" 표시용
          del('gpu_alive');
          del('gpu_strikes');
          mode = 'cpu';
        } else {
          var mark = function () { set('gpu_alive', String(Date.now())); };
          var clear = function () { del('gpu_alive'); };
          mark();
          window.addEventListener('pagehide', clear);
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') mark(); else clear();
          });
        }
      }
      // Dart(main.dart) 가 해상도 기본값을 정할 때 참고
      set('engine_effective', mode);

      var config = {};
      if (mode === 'cpu') {
        config.canvasKitForceCpuOnly = true;
      } else if (mode === 'multi') {
        config.canvasKitForceMultiSurfaceRasterizer = true;
        config.canvasKitMaximumSurfaces = 2;
      }
      window.__appEngineConfig = config;
    })();

    _flutter.loader.load({
      config: window.__appEngineConfig,
      serviceWorkerSettings: {
        serviceWorkerVersion: {{flutter_service_worker_version}}
      }
    });
  </script>
</body>
</html>
