name: somang_library
description: "소망 도서관 — 베를린 소망교회 교인들의 책 나눔 웹앱"
publish_to: 'none'

# 배포 전 + 뒤 날짜를 올린다 (겨자씨와 같은 규칙)
version: 0.1.4+20261010

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 겨자씨(mustardseed)와 같은 버전대 — 같은 Firebase 프로젝트를 공유한다
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  cloud_functions: ^6.0.0
  firebase_messaging: ^16.0.0 # 웹 푸시 (대여 신청·수락·반납 알림)
  intl: ^0.20.2
  http: ^1.2.0
  # 바코드 사진 찍기: 폰 기본 카메라(자동초점·고해상도) → web/zxing(zxing-wasm)으로 인식
  image_picker: ^1.2.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
